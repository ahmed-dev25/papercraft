<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paperfolk — a pop-up hidden-object game</title>
<meta name="description" content="Eight little paper folk hide in a pop-up world. Find them all — and fold the page flat to meet the shy ones.">
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #c9b27e; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }

  /* paper, ink, light: the HUD is a few cut-paper tabs, never chrome */
  :root { --page: #efe0c2; --core: #fbf6ea; --ink: #5a3a28; --shadow: rgba(90, 58, 40, .45); }
  * { box-sizing: border-box; }

  /* the world build is one synchronous ~10-20 s block: DOM counters would never update, so the note is a small
     paper sheet pulsing on opacity and transform alone — the compositor animates those even while JS blocks */
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--page); z-index: 10;
  }
  #loading .sheet {
    background: var(--core); color: var(--ink); padding: 20px 34px;
    border: 1px solid rgba(90, 58, 40, .45);
    box-shadow: 0 2px 4px var(--shadow), 0 18px 40px -8px var(--shadow);
    font: italic 17px/1.4 Georgia, serif; letter-spacing: .04em;
    clip-path: polygon(0 7%, 3% 0, 97% 2%, 100% 9%, 99% 93%, 96% 100%, 4% 98%, 1% 91%);
    animation: pf-print 1.6s ease-in-out infinite;
  }
  @keyframes pf-print {
    0%, 100% { opacity: .55; transform: translateY(0) rotate(-.4deg); }
    50% { opacity: 1; transform: translateY(-7px) rotate(.4deg); }
  }

  #hint {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    font: italic 14px/1.35 Georgia, 'Times New Roman', serif; color: #fff6e4; letter-spacing: .03em;
    text-shadow: 0 1px 3px #5a3a20; opacity: .85; pointer-events: none; transition: opacity 1.6s ease; text-align: center;
  }
  #hint.fade { opacity: 0; }

  #hud {
    position: fixed; left: 18px; bottom: 18px; display: flex; align-items: center; gap: 10px; z-index: 30;
    background: var(--core); border: 1px solid rgba(90, 58, 40, .6); padding: 7px 12px;
    box-shadow: 0 2px 4px var(--shadow), 0 10px 22px -6px var(--shadow);
    clip-path: polygon(0 10%, 2% 0, 98% 3%, 100% 12%, 99% 90%, 97% 100%, 3% 97%, 1% 88%);
    pointer-events: none;
  }
  #folk-tokens { display: flex; gap: 6px; }
  .token {
    width: 22px; height: 28px; border: 1px solid rgba(90, 58, 40, .55);
    background: var(--page); box-shadow: inset 0 0 0 1px rgba(251, 246, 234, .8);
    clip-path: polygon(0 6%, 4% 0, 96% 2%, 100% 8%, 99% 94%, 95% 100%, 5% 98%, 1% 93%);
    transition: background .35s ease, transform .35s ease;
  }
  .token.shy { border-style: dashed; }
  .token.found { background: var(--base); transform: translateY(-3px); }

  #count {
    font: 13px/1 Georgia, serif; letter-spacing: .08em; color: var(--ink); padding-left: 4px;
  }

  #toast {
    position: fixed; left: 50%; top: 22px; transform: translateX(-50%) translateY(-8px);
    background: var(--core); color: var(--ink); border: 1px solid rgba(90, 58, 40, .45);
    box-shadow: 0 2px 4px var(--shadow), 0 10px 22px -6px var(--shadow);
    font: italic 14px/1.4 Georgia, serif; padding: 8px 18px;
    opacity: 0; transition: opacity .4s ease, transform .4s ease; pointer-events: none;
    clip-path: polygon(0 10%, 2% 0, 98% 3%, 100% 12%, 99% 92%, 97% 100%, 3% 97%, 1% 88%);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #endcard {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(90, 58, 40, .25); transition: opacity .5s ease;
  }
  #endcard.hidden { opacity: 0; pointer-events: none; }
  #endcard .sheet {
    background: var(--core); color: var(--ink); max-width: 420px; width: calc(100% - 48px);
    padding: 34px 38px 28px; position: relative; text-align: center;
    border: 1px solid rgba(90, 58, 40, .3);
    box-shadow: 0 2px 4px var(--shadow), 0 24px 50px -10px var(--shadow);
    font: 16px/1.65 Georgia, 'Times New Roman', serif;
  }
  #endcard .sheet::before {
    content: ""; position: absolute; inset: 11px; pointer-events: none;
    border: 1.5px solid rgba(90, 58, 40, .5); outline: 1px solid rgba(90, 58, 40, .25); outline-offset: 3px;
  }
  #endcard h1 { margin: 0 0 6px; font-weight: normal; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; }
  #endcard .names { font-style: italic; opacity: .8; font-size: 14px; margin: 4px 0 14px; }
  #endcard .time { font-size: 34px; margin: 10px 0 18px; letter-spacing: .06em; }
  #endcard button {
    font: 14px/1 Georgia, serif; letter-spacing: .1em; text-transform: uppercase; color: var(--ink);
    background: var(--page); border: 1px solid rgba(90, 58, 40, .5); padding: 10px 18px; margin: 0 6px;
    cursor: pointer; box-shadow: 0 1px 0 var(--core), 2px 3px 8px -2px var(--shadow);
    clip-path: polygon(0 8%, 3% 0, 97% 2%, 100% 10%, 99% 93%, 96% 100%, 4% 98%, 1% 90%);
  }
  #endcard button:hover { transform: translateY(-1px); }
</style>
<!-- three r187 vendored into assets/vendor/ (needs its sibling three.core.js); "papercraft/" points at the assets root -->
<script type="importmap">{ "imports": { "three": "../../vendor/three.module.js", "papercraft/": "../../" } }</script>
<script>
  // the world is authored for a 16:9 frame; a narrower window would crop its edges and cut folk off. Render the full
  // frame scaled to fit instead (letterboxed), keeping every seed param intact. Once is enough: the guard exits.
  if (!/[?&]size=/.test(location.search) && innerWidth / innerHeight < 1.6) {
    var q = location.search ? location.search + '&' : '?';
    location.replace(location.pathname + q + 'size=1778x1000');
  }
</script>
</head>
<body>
<div id="loading"><div class="sheet">the page is being printed…</div></div>
<script>
  // paperfolk: the page reports its own health in plain words. This runs BEFORE the game module, so even a
  // first-line crash replaces the note with the actual reason instead of a silent blank screen.
  (function () {
    var sheet = document.querySelector('#loading .sheet');
    function say(msg) { if (sheet) sheet.textContent = msg; }
    try {
      if (!document.createElement('canvas').getContext('webgl2')) {
        say('this browser cannot open the 3D paper world (WebGL2 is unavailable) — opening the 2D edition');
        setTimeout(function () { location.replace('../paperfolk-2d/' + location.search); }, 900);
      }
    } catch (e) { say('this browser blocked the 3D check: ' + e.message); }
    window.addEventListener('error', function (e) {
      var ld = document.getElementById('loading');
      if (ld) ld.style.display = 'flex';
      say('something went wrong while printing the world: ' + (e && e.message ? e.message : 'unknown error'));
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      say('the world hit a snag while printing: ' + (e && e.reason && e.reason.message ? e.reason.message : 'unknown snag'));
    });
    // ?debug: a plain-text readout of what the page sees, readable without any console
    if (/[?&]debug/.test(location.search)) {
      var gl = null; try { gl = !!document.createElement('canvas').getContext('webgl2'); } catch (e2) { gl = false; }
      var errText = 'none';
      window.addEventListener('error', function (e) { errText = (e && e.message) || 'unknown'; }, true);
      var box = document.createElement('div');
      box.id = 'pf-debug';
      box.style.cssText = 'position:fixed;left:10px;top:10px;z-index:99;background:#fbf6ea;color:#5a3a28;border:1.5px solid #5a3a28;padding:10px 14px;font:13px/1.6 Consolas,monospace;max-width:80vw;box-shadow:0 2px 10px rgba(0,0,0,.35)';
      document.body.appendChild(box);
      setInterval(function () {
        var cv = document.querySelector('canvas');
        box.innerHTML =
          'webgl2: ' + gl +
          '<br>module: ' + (window.__paperfolk ? 'loaded (v' + window.__paperfolk.ver + ')' : 'NOT loaded') +
          '<br>canvas: ' + (cv ? cv.width + 'x' + cv.height : 'none') +
          '<br>tokens: ' + document.querySelectorAll('.token.found').length + ' found / ' + document.querySelectorAll('.token').length +
          '<br>loading note: ' + (document.getElementById('loading') ? 'still up' : 'removed') +
          '<br>error: ' + errText +
          '<br>url: ' + location.search;
      }, 700);
    }
  })();
</script>
<div id="hint">eight paperfolk hide in the world — click one to greet it<br>click the empty page to fold it flat and back again</div>
<div id="hud"><div id="folk-tokens"></div><div id="count">0 of 8</div></div>
<div id="toast"></div>
<div id="endcard" class="hidden">
  <div class="sheet">
    <h1>all the folk are found</h1>
    <div class="names" id="final-names"></div>
    <div class="time" id="final-time">0:00</div>
    <button id="shuffle">shuffle the folk</button>
    <button id="stay">stay a while</button>
  </div>
</div>
<script type="module" src="./game.js"></script>
</body>
</html>
