<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>crease — a book of folded specimens</title>
<meta name="description" content="A page from a naturalist's book of folded paper specimens. Fold the printed cards to fill ten die-cut plates. Ten folds, no timer.">
<link rel="icon" href="data:,">
<style>
  :root {
    --ink: #3a2718;
    --ink-soft: rgba(58, 39, 24, .62);
    --page: #efe0c2;
    --core: #f8efd9;
    --accent: #8a3d2a;
    --moss: #5f6b3a;
    --teal: #1f4348;
    --brass: #b08a4a;
    --shadow: rgba(58, 39, 24, .35);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #2b211b;
  }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
    z-index: 0;
  }
  #stage.dragging { cursor: grabbing; }
  #safe-area {
    position: fixed;
    inset: 0;
    visibility: hidden;
    pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #ui {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    color: var(--ink);
  }
  #play-ui[hidden], .screen[hidden] { display: none; }
  .screen {
    position: absolute;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .screen button { pointer-events: auto; }

  /* ------------------------------------------------------------------ the play page */
  .hud {
    position: absolute;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    font: 600 12.5px/1.2 Georgia, 'Times New Roman', serif;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: rgba(58, 39, 24, .86);
    white-space: nowrap;
  }
  .hud .right { text-align: right; }
  .dots {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .dot {
    display: block;
    width: 6px;
    height: 6px;
    border: 1px solid rgba(58, 39, 24, .66);
    border-radius: 50%;
  }
  .dot.on {
    background: rgba(58, 39, 24, .9);
    border-color: rgba(58, 39, 24, .9);
  }
  .dot.done {
    background: rgba(95, 107, 58, .82);
    border-color: rgba(95, 107, 58, .82);
  }
  .plate {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    text-align: center;
    font-family: Georgia, 'Times New Roman', serif;
    text-transform: uppercase;
    color: rgba(58, 39, 24, .92);
  }
  .plate .plate-no {
    font-size: 11.5px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: .24em;
    color: rgba(58, 39, 24, .62);
  }
  .plate .plate-title {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: .18em;
  }
  .plate::after {
    content: '';
    display: block;
    width: 96px;
    height: 1px;
    margin-top: 3px;
    background: rgba(58, 39, 24, .26);
  }
  .caption {
    position: absolute;
    text-align: center;
    font: italic 15.5px/1.35 Georgia, 'Times New Roman', serif;
    color: rgba(58, 39, 24, .82);
  }
  .hint {
    position: absolute;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    pointer-events: none;
    opacity: 1;
    transform: translateY(-100%);
    transition: opacity .8s ease;
  }
  .hint.faded { opacity: 0; }
  .hint-tag {
    display: inline-block;
    max-width: 100%;
    padding: 5px 10px 6px;
    background: rgba(248, 239, 217, .76);
    border: 1px solid rgba(58, 39, 24, .18);
    border-radius: 2px;
    box-shadow: 0 1px 0 rgba(255, 248, 232, .5);
    font: italic 14px/1.4 Georgia, 'Times New Roman', serif;
    color: rgba(58, 39, 24, .7);
    text-align: center;
  }
  .hint-tag::before {
    content: 'hint';
    display: inline-block;
    margin-right: 7px;
    padding-right: 7px;
    border-right: 1px solid rgba(58, 39, 24, .26);
    font: 600 11.5px/1 Georgia, 'Times New Roman', serif;
    font-style: normal;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: rgba(58, 39, 24, .55);
    vertical-align: 1px;
  }
  .tools {
    position: absolute;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 18px;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    pointer-events: none;
  }
  .btn {
    pointer-events: auto;
    min-width: 44px;
    min-height: 44px;
    padding: 0 8px;
    background: transparent;
    border: 0;
    border-bottom: 1px solid rgba(58, 39, 24, .55);
    border-radius: 0;
    color: rgba(58, 39, 24, .88);
    font: 14px/1 Georgia, 'Times New Roman', serif;
    letter-spacing: .06em;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .btn:hover {
    color: #1f140d;
    border-bottom-color: #1f140d;
  }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px dashed #3a2718; outline-offset: 4px; }
  .btn:disabled {
    opacity: .35;
    cursor: default;
    border-bottom-color: rgba(58, 39, 24, .22);
  }
  .btn.next {
    display: none;
    color: #f4e6c8;
    background: #3a2718;
    border: 1px solid #21150c;
    border-bottom: 1px solid rgba(239, 224, 194, .48);
    padding: 0 15px;
    min-height: 44px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .07em;
    box-shadow: 0 2px 0 rgba(33, 21, 12, .3);
  }
  .btn.next:hover { color: #fff6e2; background: #2e1e12; }
  .btn.next.show { display: inline-flex; align-items: center; justify-content: center; }
  .crumbs {
    position: absolute;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    pointer-events: none;
    font: 600 11.5px/1.15 Georgia, 'Times New Roman', serif;
    letter-spacing: .11em;
    text-transform: uppercase;
    color: rgba(58, 39, 24, .68);
  }
  .crumb-rule {
    display: block;
    width: 100%;
    height: 1px;
    background: rgba(58, 39, 24, .14);
  }
  .crumb-rule i {
    display: block;
    width: 0;
    height: 100%;
    background: rgba(95, 107, 58, .68);
    transition: width .3s ease;
  }

  /* ------------------------------------------------------------------ the cover */
  .cover { padding: clamp(14px, 3.2vh, 28px) clamp(16px, 6vw, 42px); }
  .cover-inner {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    text-align: center;
  }
  .cover-imprint {
    margin: 0 0 clamp(4px, 1vh, 10px);
    font: 600 11.5px/1 Georgia, 'Times New Roman', serif;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: rgba(58, 39, 24, .58);
  }
  .cover-specimen {
    position: relative;
    flex: 0 1 40%;
    width: min(78%, 380px);
    min-height: 120px;
    margin: 0 0 24px;
  }
  .cover-specimen-label {
    position: absolute;
    left: 0;
    right: 0;
    bottom: -19px;
    font: italic 12px/1 Georgia, 'Times New Roman', serif;
    letter-spacing: .04em;
    color: rgba(58, 39, 24, .66);
  }
  .cover-title {
    margin: 0;
    font: 400 clamp(40px, 7vh, 60px)/1 Georgia, 'Times New Roman', serif;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: rgba(58, 39, 24, .94);
    text-indent: .15em;
  }
  .cover-sub {
    margin: 7px 0 0;
    font: italic clamp(16px, 2.1vh, 18px)/1.3 Georgia, 'Times New Roman', serif;
    color: rgba(58, 39, 24, .78);
  }
  .cover-line {
    margin: clamp(8px, 1.6vh, 16px) 0 0;
    max-width: 28ch;
    font: italic 15px/1.45 Georgia, 'Times New Roman', serif;
    color: rgba(58, 39, 24, .74);
  }
  .open-book {
    margin: clamp(12px, 2.4vh, 22px) 0 0;
    min-height: 48px;
    min-width: 200px;
    padding: 0 24px;
    background: #3a2718;
    color: #f4e6c8;
    border: 1px solid #21150c;
    border-bottom: 1px solid rgba(239, 224, 194, .48);
    border-radius: 1px;
    box-shadow: 0 2px 0 rgba(33, 21, 12, .3), 0 9px 18px -8px rgba(33, 21, 12, .5);
    font: 600 15px/1 Georgia, 'Times New Roman', serif;
    letter-spacing: .1em;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .open-book:hover { background: #2e1e12; color: #fff6e2; }
  .open-book:active { transform: translateY(1px); }
  .open-book:focus-visible { outline: 2px dashed #3a2718; outline-offset: 4px; }
  .cover-foot {
    margin: clamp(8px, 1.5vh, 14px) 0 0;
    font: 11.5px/1.2 Georgia, 'Times New Roman', serif;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: rgba(58, 39, 24, .58);
  }
  .cover-foot span { margin: 0 .45em; }
  .fold-corner {
    position: absolute;
    top: 0;
    right: 0;
    width: 34px;
    height: 34px;
    background: linear-gradient(225deg, #d7c096 0 49%, rgba(112, 80, 48, .18) 50%, transparent 51%);
    box-shadow: -3px 3px 7px -2px rgba(58, 39, 24, .35);
    pointer-events: none;
  }

  /* ------------------------------------------------------------------ the completion card */
  .end { padding: clamp(14px, 3vh, 30px) clamp(16px, 6vw, 44px); }
  .end-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 500px;
    text-align: center;
    gap: clamp(6px, 1.1vh, 11px);
  }
  .end-kicker {
    margin: 0;
    font: 600 11.5px/1 Georgia, 'Times New Roman', serif;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: rgba(58, 39, 24, .6);
  }
  .end-title {
    margin: 0;
    max-width: 17ch;
    font: 400 clamp(25px, 4.6vh, 36px)/1.16 Georgia, 'Times New Roman', serif;
    letter-spacing: .035em;
    color: rgba(58, 39, 24, .94);
  }
  .end-rule {
    width: 170px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(58, 39, 24, .42), transparent);
  }
  .end-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: clamp(5px, 1vh, 9px);
    width: 100%;
    max-width: 420px;
    margin: 2px 0 0;
  }
  .end-cell {
    position: relative;
    aspect-ratio: 1 / 1;
    background: rgba(255, 247, 226, .28);
    border: 1px solid rgba(58, 39, 24, .22);
    box-shadow: inset 1px 1px 0 rgba(58, 39, 24, .08), inset -1px -1px 0 rgba(255, 250, 238, .4);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .end-cell svg { width: 84%; height: 84%; display: block; }
  .end-cell-no {
    position: absolute;
    left: 4px;
    top: 2px;
    font: italic 11.5px/1 Georgia, 'Times New Roman', serif;
    color: rgba(58, 39, 24, .58);
  }
  .end-stats {
    margin: 1px 0 0;
    font: 13px/1.35 Georgia, 'Times New Roman', serif;
    letter-spacing: .04em;
    color: rgba(58, 39, 24, .7);
  }
  .end-stamp {
    position: relative;
    width: 152px;
    height: 74px;
    margin: 2px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    border: 1.5px solid rgba(58, 39, 24, .68);
    border-radius: 50%;
    transform: rotate(-5deg);
    color: rgba(58, 39, 24, .8);
  }
  .end-stamp::before {
    content: '';
    position: absolute;
    inset: 4px;
    border: 1px solid rgba(58, 39, 24, .45);
    border-radius: 50%;
  }
  .end-stamp span {
    font: 600 11.5px/1 Georgia, 'Times New Roman', serif;
    letter-spacing: .13em;
  }
  .end-stamp em {
    font: italic 11.5px/1 Georgia, 'Times New Roman', serif;
    letter-spacing: .04em;
  }
  .end-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 2px;
  }

  #loading {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--page);
  }
  .loading-sheet {
    max-width: 80vw;
    padding: 18px 30px;
    background: var(--core);
    border: 1px solid rgba(58, 39, 24, .4);
    box-shadow: 0 2px 4px var(--shadow), 0 16px 34px -10px var(--shadow);
    font: italic 16px/1.4 Georgia, 'Times New Roman', serif;
    letter-spacing: .03em;
    text-align: center;
  }
  @media (max-width: 760px) {
    .hud { font-size: 12px; letter-spacing: .1em; }
    .dots { gap: 4px; }
    .dot { width: 5px; height: 5px; }
    .plate { flex-direction: row; align-items: baseline; justify-content: center; gap: 7px; }
    .plate .plate-no { display: inline; font-size: 11.5px; letter-spacing: .18em; }
    .plate .plate-no::after { content: ' ·'; color: rgba(58, 39, 24, .45); }
    .plate .plate-title { font-size: 13px; letter-spacing: .16em; }
    .plate::after { display: none; }
    .caption { font-size: 15px; }
    .hint-tag { font-size: 14px; }
    .crumbs { display: flex; }
    .tools { gap: 14px; }
    .btn { font-size: 14px; padding: 0 6px; }
    .btn.next { font-size: 14.5px; }
    .cover-specimen { flex-basis: 36%; width: 82%; }
    .cover-title { font-size: clamp(38px, 6.8vh, 54px); }
    .cover-line { font-size: 14.5px; }
    .end { padding-left: 14px; padding-right: 14px; }
    .end-grid { gap: 5px; }
    .end-stamp { width: 138px; height: 68px; }
  }
  @media (max-height: 700px) {
    .cover-specimen { flex-basis: 30%; }
    .cover-line { margin-top: 6px; }
    .open-book { margin-top: 10px; }
    .end-stamp { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hint { transition: none; }
    .btn, .open-book { transition: none; }
    .crumb-rule i { transition: none; }
  }
</style>
<script defer data-website-id="5s413x694i0a0x6x" src="https://stats.buildquietly.com/js/script.js"></script>
<script src="../track.js" data-game="crease" data-end="#end"></script>
</head>
<body>
<div id="safe-area" aria-hidden="true"></div>
<canvas id="stage" role="application" aria-label="crease, a book of folded paper specimens. On the play page, drag the brass tab on a flap across its dashed crease; the folded card must match the shape cut out of the page above."></canvas>

<div id="ui">
  <div id="play-ui" hidden>
    <div id="hud" class="hud" aria-live="polite">
      <span id="page-num">page 1 of 10</span>
      <span id="dots" class="dots"></span>
      <span id="fold-count" class="right">folds 0</span>
    </div>
    <div id="plate" class="plate"></div>
    <div id="caption" class="caption">the shape to make</div>
    <div id="crumbs" class="crumbs">
      <span id="crumb-text">folded 0 of 10</span>
      <span class="crumb-rule"><i id="crumb-fill"></i></span>
    </div>
    <div id="hint" class="hint" role="note"></div>
    <div id="tools" class="tools">
      <button id="unfold" class="btn" type="button" aria-label="unfold the last fold">unfold</button>
      <button id="restart" class="btn" type="button" aria-label="restart this page">restart</button>
      <button id="next" class="btn next" type="button" aria-label="go to the next page">next page</button>
    </div>
  </div>

  <section id="cover" class="screen cover" hidden aria-label="crease, a book of folded specimens">
    <div class="cover-inner">
      <p class="cover-imprint">the menagerie press</p>
      <div class="cover-specimen" id="cover-specimen" role="img" aria-label="a printed moth specimen pasted on a cream card">
        <span class="cover-specimen-label">plate I · the moth</span>
      </div>
      <h1 class="cover-title">Crease</h1>
      <p class="cover-sub">a book of folded specimens</p>
      <p class="cover-line">fold the printed card to fill each die&#8209;cut plate</p>
      <button id="open-book" class="open-book" type="button">open the book</button>
      <p class="cover-foot">ten plates <span>·</span> no timer</p>
      <span class="fold-corner" aria-hidden="true"></span>
    </div>
  </section>

  <section id="end" class="screen end" hidden aria-label="the menagerie is complete">
    <div class="end-inner">
      <p class="end-kicker">plates I–X</p>
      <h2 class="end-title">the menagerie is complete</h2>
      <div class="end-rule" aria-hidden="true"></div>
      <div id="end-grid" class="end-grid" role="list" aria-label="the ten folded specimens"></div>
      <p id="end-stats" class="end-stats"></p>
      <div class="end-stamp" aria-hidden="true"><span>MENAGERIE</span><em>complete</em></div>
      <div class="end-actions">
        <button id="again" class="btn next show" type="button">fold again</button>
        <button id="to-cover" class="btn" type="button">back to the cover</button>
      </div>
    </div>
  </section>
</div>

<div id="loading"><div class="loading-sheet">printing the plates…</div></div>

<script type="importmap">{ "imports": { "papercraft/": "../../" } }</script>
<script type="module" src="./game.js"></script>
</body>
</html>
