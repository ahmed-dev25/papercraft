<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>paperfair — a pop-up carnival shooting gallery</title>
<meta name="description" content="A dusk paper carnival: shoot the tin cans, bottles, pie tins, balloons and prize stars with a paper pop-gun before the ticket runs out. Everything folds up from the printed page.">
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #b7a88b; }
  /* the OS pointer is ALWAYS visible over the canvas: the printed reticle is an aid, never a replacement
     (cursor:none here was the bug that made the fair unplayable). crosshair reads as "aim here". */
  html, body { cursor: default; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; z-index: 0; }

  /* paper, ink, light: the HUD is a fairground scorecard and a torn ticket, never chrome */
  :root { --page: #efe0c2; --core: #fbf6ea; --ink: #33211d; --coral: #cf4f3e; --gold: #d9a441; --shadow: rgba(51, 33, 29, .45); }
  * { box-sizing: border-box; }

  /* one synchronous build: the note pulses on opacity and transform alone, so the compositor keeps it alive */
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--page); z-index: 50;
  }
  #loading .sheet {
    background: var(--core); color: var(--ink); padding: 20px 34px;
    border: 1px solid rgba(51, 33, 29, .45);
    box-shadow: 0 2px 4px var(--shadow), 0 18px 40px -8px var(--shadow);
    font: italic 17px/1.4 Georgia, serif; letter-spacing: .04em;
    clip-path: polygon(0 7%, 3% 0, 97% 2%, 100% 9%, 99% 93%, 96% 100%, 4% 98%, 1% 91%);
    animation: pf-print 1.6s ease-in-out infinite;
  }
  @keyframes pf-print {
    0%, 100% { opacity: .55; transform: translateY(0) rotate(-.4deg); }
    50% { opacity: 1; transform: translateY(-7px) rotate(.4deg); }
  }

  /* the ticket strip along the top edge: twelve tear lines, one torn off every five seconds */
  /* hung flush on the calm top edge, clear of the blurred counter band at the bottom */
  #ticket {
    position: fixed; top: -3px; left: 50%; transform: translateX(-50%);
    z-index: 24; display: flex; align-items: stretch; height: 25px;
    background: var(--core); color: var(--ink); border: 1px solid rgba(51, 33, 29, .55);
    border-top: 0; box-shadow: 0 2px 4px var(--shadow), 0 10px 22px -8px var(--shadow);
    font: 600 8px/1 Georgia, serif; letter-spacing: .16em; text-transform: uppercase;
    pointer-events: none; overflow: hidden;
    clip-path: polygon(0 0, 100% 0, 100% 82%, 97% 100%, 3% 96%, 0 84%);
  }
  #ticket .stub {
    display: flex; align-items: center; justify-content: center; width: 104px; flex: none;
    border-right: 1px dashed rgba(51, 33, 29, .55); color: rgba(51, 33, 29, .78);
    background: linear-gradient(to bottom, rgba(207, 79, 62, .13), transparent);
  }
  #tears { display: flex; align-items: stretch; }
  #tears .seg {
    position: relative; width: 44px; flex: none; border-right: 1px dashed rgba(159, 55, 50, .75);
    transition: width .5s ease, opacity .35s ease;
    background:
      radial-gradient(circle at 50% 12%, rgba(51, 33, 29, .3) 0 1px, transparent 1.4px) 0 0 / 100% 12px no-repeat,
      linear-gradient(to bottom, rgba(217, 164, 65, .12), transparent);
  }
  #tears .seg:last-child { border-right: 0; }
  #tears .seg.torn { width: 0; opacity: 0; border-right: 0; }
  #tears .seg::after {
    content: attr(data-n); position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font: italic 10px/1 Georgia, serif; letter-spacing: 0; color: rgba(51, 33, 29, .38);
  }

  /* the scorecard: a fairground card pinned at the top left, ink tallies for the streak */
  #scorecard {
    position: fixed; left: 18px; top: 40px; z-index: 24; min-width: 136px;
    background: var(--core); color: var(--ink); border: 1px solid rgba(51, 33, 29, .55);
    padding: 9px 14px 10px; pointer-events: none;
    box-shadow: 0 2px 4px var(--shadow), 0 12px 24px -8px var(--shadow);
    font: 13px/1.15 Georgia, 'Times New Roman', serif;
    clip-path: polygon(0 9%, 2% 0, 98% 2%, 100% 10%, 99% 91%, 97% 100%, 3% 98%, 1% 90%);
  }
  #scorecard::before { content: ""; position: absolute; inset: 5px; border: 1px solid rgba(51, 33, 29, .28); pointer-events: none; }
  #scorecard .label { font: 600 8px/1 Georgia, serif; letter-spacing: .18em; text-transform: uppercase; opacity: .68; }
  #scorecard .row { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
  #score { font: italic 26px/1.05 Georgia, serif; letter-spacing: .04em; }
  #scorecard .best { font: italic 10px/1 Georgia, serif; color: rgba(51, 33, 29, .62); }
  #streak { display: flex; align-items: center; gap: 3px; min-height: 11px; padding-top: 4px; }
  #streak i { display: block; width: 2px; height: 11px; background: var(--ink); opacity: .8; transform: rotate(7deg); border-radius: 1px; }
  #streak i:nth-child(3n) { transform: rotate(-6deg); height: 10px; }
  #streak em { font: italic 10px/1 Georgia, serif; color: rgba(51, 33, 29, .7); margin-left: 3px; }

  #toast {
    position: fixed; left: 50%; top: 42px; transform: translateX(-50%) translateY(-8px);
    background: var(--core); color: var(--ink); border: 1px solid rgba(51, 33, 29, .45);
    box-shadow: 0 2px 4px var(--shadow), 0 10px 22px -6px var(--shadow);
    font: italic 13px/1.4 Georgia, serif; padding: 7px 16px;
    opacity: 0; transition: opacity .4s ease, transform .4s ease; pointer-events: none; z-index: 70;
    clip-path: polygon(0 10%, 2% 0, 98% 3%, 100% 12%, 99% 92%, 97% 100%, 3% 97%, 1% 88%);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* the paper "how to play" card: cream, ink, a torn edge and a small neatline */
  #help {
    position: fixed; left: 50%; top: 62px; transform: translateX(-50%);
    z-index: 9; width: max-content; max-width: min(460px, calc(100vw - 96px));
    pointer-events: none; text-align: center;
    transition: opacity .6s ease, transform .6s ease;
  }
  #help.hidden { opacity: 0; transform: translateX(-50%) translateY(-6px); }
  #help .sheet {
    position: relative; display: inline-block; padding: 13px 26px 12px;
    background: var(--core); color: var(--ink); border: 1px solid rgba(51, 33, 29, .42);
    box-shadow: 0 2px 4px var(--shadow), 0 14px 30px -8px var(--shadow);
    font: 14px/1.5 Georgia, 'Times New Roman', serif;
    clip-path: polygon(0 9%, 2% 0, 98% 2%, 100% 11%, 99% 90%, 97% 100%, 3% 98%, 1% 88%);
  }
  #help .sheet::before { content: ""; position: absolute; inset: 6px; pointer-events: none; border: 1px solid rgba(51, 33, 29, .3); }
  #help h2 { margin: 0 0 7px; font-weight: normal; font-size: 13px; letter-spacing: .14em; }
  #help ul { margin: 0; padding: 0; list-style: none; }
  #help li { position: relative; padding-left: 16px; margin: 2px 0; }
  #help li::before {
    content: ""; position: absolute; left: 2px; top: .52em; width: 5px; height: 5px; border-radius: 50%;
    background: var(--ink); opacity: .7; box-shadow: 0 0 0 2px rgba(51, 33, 29, .14);
  }
  #help-tab {
    position: fixed; top: 36px; right: 16px; width: 26px; height: 30px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 30; pointer-events: auto; cursor: pointer; appearance: none; -webkit-appearance: none;
    background: var(--core); color: var(--ink); border: 1px solid rgba(51, 33, 29, .55);
    font: 15px/1 Georgia, serif; box-shadow: 0 2px 4px var(--shadow);
    clip-path: polygon(0 8%, 5% 0, 95% 3%, 100% 12%, 99% 90%, 94% 100%, 6% 97%, 1% 88%);
    user-select: none; -webkit-user-select: none;
  }
  #help-tab:hover { transform: translateY(-1px); }
  #help-tab:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  #endcard {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(51, 33, 29, .28); transition: opacity .5s ease; z-index: 60;
  }
  #endcard.hidden { opacity: 0; pointer-events: none; }
  #endcard .sheet {
    background: var(--core); color: var(--ink); max-width: 430px; width: calc(100% - 48px);
    padding: 32px 38px 28px; position: relative; text-align: center;
    border: 1px solid rgba(51, 33, 29, .3);
    box-shadow: 0 2px 4px var(--shadow), 0 24px 50px -10px var(--shadow);
    font: 16px/1.6 Georgia, 'Times New Roman', serif;
  }
  #endcard .sheet::before { content: ""; position: absolute; inset: 11px; pointer-events: none; border: 1.5px solid rgba(51, 33, 29, .5); outline: 1px solid rgba(51, 33, 29, .25); outline-offset: 3px; }
  #endcard h1 { margin: 0 0 4px; font-weight: normal; font-size: 21px; letter-spacing: .14em; text-transform: uppercase; }
  #endcard .kicker { font: italic 12px/1.4 Georgia, serif; color: rgba(51, 33, 29, .68); }
  #endcard .score { font-size: 44px; margin: 8px 0 0; letter-spacing: .05em; font-style: italic; }
  #endcard .rows { display: flex; justify-content: center; gap: 26px; margin: 10px 0 4px; font-size: 13px; }
  #endcard .rows b { font-style: italic; font-size: 16px; }
  #endcard .prizes { margin: 12px auto 18px; max-width: 300px; font: italic 13px/1.5 Georgia, serif; color: rgba(51, 33, 29, .78); border-top: 1px solid rgba(51, 33, 29, .22); padding-top: 11px; }
  #endcard button {
    font: 14px/1 Georgia, serif; letter-spacing: .1em; text-transform: uppercase; color: var(--ink);
    background: var(--page); border: 1px solid rgba(51, 33, 29, .5); padding: 10px 20px; margin: 0 6px;
    cursor: pointer; box-shadow: 0 1px 0 var(--core), 2px 3px 8px -2px var(--shadow);
    clip-path: polygon(0 8%, 3% 0, 97% 2%, 100% 10%, 99% 93%, 96% 100%, 4% 98%, 1% 90%);
  }
  #endcard button:hover { transform: translateY(-1px); }
  #endcard button:active { transform: translate(1px, 2px); box-shadow: 0 1px 0 var(--core), 1px 1px 1px var(--shadow); }

  /* the share strip: the same cut paper as the card, ink underlines, no logos or brand marks */
  #endcard .share { margin: 16px 0 0; padding-top: 13px; border-top: 1px solid rgba(51, 33, 29, .22); }
  #endcard .share-primary { display: block; width: 100%; margin: 0; letter-spacing: .12em; }
  #endcard .share-links { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0 18px; margin: 5px 0 0; }
  #endcard .share-links a, #endcard .share-links button {
    display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 1px; margin: 0;
    background: none; border: 0; box-shadow: none; clip-path: none; color: rgba(51, 33, 29, .76);
    font: italic 13px/1 Georgia, 'Times New Roman', serif; letter-spacing: .02em; text-transform: none;
    text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-decoration-color: rgba(51, 33, 29, .42);
    cursor: pointer; touch-action: manipulation;
  }
  #endcard .share-links a:hover, #endcard .share-links button:hover { color: var(--ink); text-decoration-color: var(--ink); transform: none; }
  #endcard .share-links a:focus-visible, #endcard .share-links button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  body.has-debug #help { top: 190px; }
  body.has-debug #scorecard { top: 166px; }
  @media (max-width: 900px) {
    #ticket .stub { width: 74px; font-size: 7px; }
    #tears .seg { width: 28px; }
  }

  /* phones (html.pf-mobile is set by game.js from its MOBILE predicate: coarse pointer or a small viewport). Everything
     here is thumb-sized and clear of the home bar; on a desktop the class is absent and every rule below is dead, so
     the HUD keeps its authored 22 px tokens, its 26x30 tabs and its copy. */
  html.pf-mobile #ticket { top: env(safe-area-inset-top, 0px); height: 28px; max-width: 100vw; }
  html.pf-mobile #ticket .stub { width: 64px; font-size: 7px; }
  html.pf-mobile #tears .seg { width: clamp(18px, 5.6vw, 22px); }
  html.pf-mobile #scorecard { left: 10px; top: calc(38px + env(safe-area-inset-top, 0px)); min-width: 118px; padding: 7px 11px 8px; }
  html.pf-mobile #scorecard .label { font-size: 7.5px; }
  html.pf-mobile #score { font-size: 23px; }
  html.pf-mobile #scorecard .best { font-size: 9px; }
  html.pf-mobile #streak { min-height: 10px; padding-top: 3px; }
  html.pf-mobile #toast { top: calc(96px + env(safe-area-inset-top, 0px)); max-width: 88vw; }
  html.pf-mobile #help { top: calc(96px + env(safe-area-inset-top, 0px)); max-width: 90vw; }
  html.pf-mobile #help .sheet { padding: 10px 16px 9px; font-size: 13.5px; }
  /* the two paper tabs: at least 40x44 CSS px of touch, never a double-tap zoom of the layout */
  html.pf-mobile #help-tab { top: calc(36px + env(safe-area-inset-top, 0px)); right: 10px; width: 44px; height: 46px; font-size: 18px; touch-action: manipulation; }
  html.pf-mobile #endcard button { min-height: 44px; touch-action: manipulation; }
  html.pf-mobile #endcard .sheet {
    max-width: 90vw; max-height: calc(100vh - 28px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    max-height: calc(100dvh - 28px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  }
  html.pf-mobile #endcard .share-links { gap: 0 14px; }
  html.pf-mobile #endcard .share-links a, html.pf-mobile #endcard .share-links button { min-height: 44px; font-size: 13px; }

  /* the corner muzzle: a small torn paper flash kept as a fallback for a page that hides the toy; with the phone gun
     always visible, the 3D muzzle puff is the usual flash. */
  #muzzle {
    position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    width: 52px; height: 38px; z-index: 26; pointer-events: none; opacity: 0;
    background:
      radial-gradient(circle at 42% 48%, rgba(255,248,228,.98) 0 18%, rgba(241,225,189,.92) 30%, rgba(217,159,69,.55) 58%, rgba(217,159,69,0) 74%);
    clip-path: polygon(50% 0, 63% 24%, 92% 10%, 78% 36%, 100% 50%, 75% 60%, 90% 88%, 62% 72%, 50% 100%, 38% 73%, 9% 88%, 24% 61%, 0 50%, 24% 37%, 8% 11%, 38% 25%);
    filter: drop-shadow(0 2px 3px rgba(51, 33, 29, .4));
  }
  #muzzle.flash { animation: pf-muzzle .26s ease-out; }
  @keyframes pf-muzzle {
    0% { opacity: 0; transform: scale(.45) rotate(-10deg); }
    32% { opacity: .96; transform: scale(1) rotate(3deg); }
    100% { opacity: 0; transform: scale(1.4) rotate(-3deg); }
  }
  @media (prefers-reduced-motion: reduce) { #muzzle.flash { animation: none; opacity: .9; } }

  /* hit juice: a floating ink number on a torn cream chip. A DOM layer above the canvas and below the end card:
     crisp serif text, no canvas texture, never any glow. Eight nodes are reused, so a busy wave costs nothing. */
  #popups { position: fixed; inset: 0; z-index: 25; pointer-events: none; overflow: hidden; }
  .pf-pop {
    position: absolute; left: 0; top: 0; opacity: 0;
    padding: 5px 11px 4px; white-space: nowrap;
    color: var(--ink); background: linear-gradient(174deg, #fbf6ea 0%, #f1e1bd 58%, #e7d5ae 100%);
    font: italic 600 19px/1 Georgia, 'Times New Roman', serif; letter-spacing: .015em;
    box-shadow: 0 1px 0 rgba(251,246,234,.9) inset, 0 2px 3px rgba(51,33,29,.34), 0 8px 15px -7px rgba(51,33,29,.55);
    clip-path: polygon(3% 2%, 21% 0, 47% 4%, 71% 0, 97% 3%, 100% 27%, 96% 51%, 100% 77%, 95% 100%, 70% 96%, 45% 100%, 19% 95%, 1% 99%, 4% 73%, 0 47%, 4% 22%);
    transform: translate(-50%, -50%) scale(.9); transform-origin: 50% 70%;
    will-change: transform, opacity;
  }
  .pf-pop .mult { margin-left: .28em; font-style: normal; font-size: .72em; color: var(--coral); }
  .pf-pop.live { animation: pf-pop-rise .8s cubic-bezier(.18,.72,.25,1) forwards; }
  @keyframes pf-pop-rise {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.72) rotate(-2.2deg); }
    13% { opacity: 1; transform: translate(-50%, -57%) scale(1.13) rotate(1.4deg); }
    28% { transform: translate(-50%, -72%) scale(1) rotate(0deg); }
    100% { opacity: 0; transform: translate(-50%, calc(-50% - 40px)) scale(.98) rotate(-1.1deg); }
  }

  /* the scorecard gets a quick ink bump on every hit (no shake, no colour flash) */
  #score { transform-origin: 12% 62%; }
  #score.bump { animation: pf-score-bump .35s cubic-bezier(.2,.8,.3,1); }
  @keyframes pf-score-bump {
    0% { transform: scale(1) rotate(0deg); }
    34% { transform: scale(1.18) rotate(-1.6deg); }
    68% { transform: scale(.97) rotate(.4deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  /* NEW BEST: an inked paper stamp beside the end-card score, clear of the share strip below */
  #newbest {
    position: absolute; top: 88px; right: 20px; z-index: 1;
    padding: 6px 10px 5px; pointer-events: none; opacity: 0;
    color: var(--coral); background: rgba(251, 246, 234, .58);
    border: 2px solid rgba(207, 79, 62, .88); outline: 1px solid rgba(51, 33, 29, .34); outline-offset: 2px;
    font: italic 700 12px/1 Georgia, 'Times New Roman', serif; letter-spacing: .17em; text-transform: uppercase;
    transform: rotate(-8deg);
    clip-path: polygon(2% 4%, 18% 0, 42% 5%, 66% 0, 92% 4%, 100% 20%, 97% 48%, 100% 76%, 93% 98%, 66% 95%, 40% 100%, 14% 95%, 0 98%, 4% 70%, 0 44%, 4% 18%);
  }
  #newbest.show { opacity: .93; animation: pf-stamp .5s cubic-bezier(.2,.8,.3,1.15); }
  @keyframes pf-stamp {
    0% { opacity: 0; transform: rotate(-15deg) scale(1.4); }
    62% { opacity: .95; transform: rotate(-6.4deg) scale(.95); }
    100% { opacity: .93; transform: rotate(-8deg) scale(1); }
  }
  html.pf-mobile #newbest { top: 84px; right: 13px; font-size: 10.5px; padding: 5px 8px 4px; }
  @media (prefers-reduced-motion: reduce) {
    #score.bump, #newbest.show { animation: none; }
    .pf-pop.live { animation: pf-pop-rise .8s cubic-bezier(.18,.72,.25,1) forwards; }
  }
</style>

<body>
<div id="loading"><div class="sheet">the fair is being set up…</div></div><script>
  // paperfair: the page reports its own health in plain words, BEFORE the game module runs, so a first-line crash
  // replaces the note with the actual reason instead of a silent blank screen.
  (function () {
    var sheet = document.querySelector('#loading .sheet');
    function say(msg) { if (sheet) sheet.textContent = msg; }
    try {
      if (!document.createElement('canvas').getContext('webgl2')) {
        say('this browser cannot open the paper fair (WebGL2 is unavailable)');
      }
    } catch (e) { say('this browser blocked the 3D check: ' + e.message); }
    window.addEventListener('error', function (e) {
      var ld = document.getElementById('loading');
      if (ld) ld.style.display = 'flex';
      say('something went wrong while setting up the fair: ' + (e && e.message ? e.message : 'unknown error'));
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      say('the fair hit a snag while setting up: ' + (e && e.reason && e.reason.message ? e.reason.message : 'unknown snag'));
    });
    // ?debug: a plain-text readout of what the page sees, readable without any console
    if (/[?&]debug/.test(location.search)) {
      var gl = null; try { gl = !!document.createElement('canvas').getContext('webgl2'); } catch (e2) { gl = false; }
      var errText = 'none';
      window.addEventListener('error', function (e) { errText = (e && e.message) || 'unknown'; }, true);
      var box = document.createElement('div');
      box.id = 'pf-debug';
      box.style.cssText = 'position:fixed;left:10px;top:10px;z-index:99;pointer-events:none;background:#fbf6ea;color:#33211d;border:1.5px solid #33211d;padding:10px 14px;font:13px/1.6 Consolas,monospace;max-width:80vw;box-shadow:0 2px 10px rgba(0,0,0,.35)';
      document.body.appendChild(box);
      setInterval(function () {
        var cv = document.querySelector('canvas');
        var pf = window.__paperfair;
        var st = null, standing = 0;
        try { st = pf ? pf.state() : null; standing = pf ? pf.targets().filter(function (t) { return t.standing; }).length : 0; } catch (e3) { standing = -1; }
        box.innerHTML =
          'webgl2: ' + gl +
          '<br>module: ' + (pf ? 'loaded (v' + pf.ver + ')' : 'NOT loaded') +
          '<br>canvas: ' + (cv ? cv.width + 'x' + cv.height : 'none') +
          '<br>score: ' + (st ? st.score + ' | best ' + st.best + ' | streak ' + st.streak : '—') +
          '<br>targets: ' + standing + ' standing' +
          '<br>state: ' + (st ? (st.done ? 'round over' : st.running ? 't ' + st.timeLeft.toFixed(1) + 's' : 'ready') : '—') +
          '<br>loading note: ' + (document.getElementById('loading') ? 'still up' : 'removed') +
          '<br>last-error: ' + errText +
          '<br>url: ' + location.search;
      }, 700);
    }
  })();
</script>
<div id="ticket" aria-hidden="true">
  <div class="stub">admit one</div>

</div>
<div id="scorecard" aria-hidden="true">

  <div class="label" style="padding-top:5px">streak</div>
  <div id="streak"></div>
</div>
<div id="toast"></div>

<div id="popups" aria-hidden="true"></div>

  <div class="sheet">
    <h2>how to play</h2>

  </div>
</div>
<button id="help-tab" type="button" aria-label="show how to play" title="how to play">?</button>
<script>
  // paperfair: the card fades on the first pointerdown (or after 12 s); the ? tab stays and brings it back. Its
  // handlers run in the window's capture phase, so a tap on the tab never reaches the game's shot.
  (function () {
    var card = document.getElementById('help'), tab = document.getElementById('help-tab');
    if (!card || !tab) return;
    if (document.getElementById('pf-debug')) document.body.classList.add('has-debug');
    var timer = null;
    function hide() { card.classList.add('hidden'); card.setAttribute('aria-hidden', 'true'); clearTimeout(timer); timer = null; }
    function show() { card.classList.remove('hidden'); card.setAttribute('aria-hidden', 'false'); clearTimeout(timer); timer = setTimeout(hide, 12000); }
    addEventListener('pointerdown', function (e) {
      if (e.target === tab) { e.stopImmediatePropagation(); return; }   // the tab has its own click handler
      hide();
    }, true);
    addEventListener('pointerup', function (e) { if (e.target === tab) e.stopImmediatePropagation(); }, true);
    tab.addEventListener('click', function (e) {
      e.preventDefault(); e.stopPropagation();
      if (card.classList.contains('hidden')) show(); else hide();
    });
    // the 12 s clock starts when the printed page is ready, not while the loading sheet still covers it
    if (document.getElementById('loading') && typeof MutationObserver !== 'undefined') {
      var obs = new MutationObserver(function () {
        if (!document.getElementById('loading')) { obs.disconnect(); show(); }
      });
      obs.observe(document.body, { childList: true, subtree: true });
    } else show();
  })();
</script>
<div id="endcard" class="hidden" role="dialog" aria-modal="true" aria-label="round over">
  <div class="sheet">
    <h1>the bell rings</h1>
    <div class="kicker">sixty seconds at the paper fair</div>
    <div class="score" id="final-score">0</div>
    <div class="kicker">points</div>
    <div id="newbest" aria-hidden="true">NEW BEST</div>
    <div class="rows"><div>best <b id="final-best">0</b></div><div>longest streak <b id="final-streak">0</b></div></div>
    <div class="prizes" id="final-prizes"></div>
    <button id="again">shoot again</button>
    <div class="share" id="share" role="group" aria-label="share your score">
      <button id="share-score" class="share-primary" type="button">share your score</button>
      <div class="share-links">
        <a id="share-x" href="#" target="_blank" rel="noopener noreferrer">X</a>
        <a id="share-wa" href="#" target="_blank" rel="noopener noreferrer">WhatsApp</a>
        <a id="share-tg" href="#" target="_blank" rel="noopener noreferrer">Telegram</a>
        <button id="share-ig" type="button">Instagram</button>
        <button id="share-copy" type="button">copy caption</button>
      </div>
    </div>
  </div>
</div>
